- date: 2026-03-04
  time_et: "3:00 PM"
  speaker: "Tingting Zhang"
  speaker_full_name: "Dr. Tingting Zhang"
  affiliation: "University of Pittsburgh"
  title: "A Unified Mixed-Effects Framework for Brain Map Correspondence"
  registration_link: "https://upenn.zoom.us/meeting/register/Uq77VRxBQze5vVowXjEfBw"
  recording_link: "https://www.youtube.com/watch?v=1mmIZv2Frrk"
  series: "Health"
  abstract: |
    Recent advances in neuroimaging technologies have generated large-scale multimodal datasets that capture complementary aspects of brain organization. These developments have fueled growing interest in identifying and quantifying associations between spatially distributed brain features across modalities, referred to as brain map correspondence. To meet this need, several permutation tests, including the spin test, Brain Surrogate Maps with Autocorrelated Spatial Heterogeneity (BrainSMASH), and the simple permutation-based intermodal correspondence (SPICE) test, have been developed to assess brain map correspondence while accounting for spatial autocorrelation. Despite their widespread use, these methods often yield inconsistent conclusions when applied to the same data, leading to long-standing confusion in the field regarding their interpretation and relationships.

    We address this challenge by introducing a unified two-factor mixed-effects model that explicitly parameterizes inter-subject variability and spatial variability across brain locations. This formulation provides a principled statistical framework for decomposing sources of variation in brain maps and for formally linking each permutation test to the specific component of variability it probes. Within this framework, we derive analytical expressions for the null distributions of the spin test, BrainSMASH, and SPICE, thereby clarifying their implicit assumptions and fundamental distinctions.

    Using extensive simulations and empirical analyses of both structural and functional brain maps, we demonstrate that the proposed modeling-based approach achieves well-calibrated type I error, substantially improved statistical power, and a more comprehensive and interpretable characterization of brain map correspondence.
  speaker_bio: |
    is a Professor of Statistics at the University of Pittsburgh. She received her Ph.D. in Statistics from Harvard University, where she also completed postdoctoral training. Dr. Zhang’s research focuses on developing efficient and robust statistical methods for analyzing large-scale multimodal brain data, with the goal of understanding both normal brain organization and neurological disorders, with a particular emphasis on Alzheimer’s disease. Dr. Zhang is an Associate Editor of the *Journal of the American Statistical Association* and the *Annals of Applied Statistics*.
