- date: 2025-04-09
  time_et: "12:00 PM"
  speaker: "Martin Lindquist"
  speaker_full_name: "Dr. Martin Lindquist"
  affiliation: "Johns Hopkins University"
  title: "Elements of Functional Neuroimaging"
  registration_link: "https://upenn.zoom.us/j/94227327976"
  recording_link: "https://www.youtube.com/watch?v=mbRuDh4Qf5g"
  series: "Health"
  abstract: |
    The field of neuroimaging, particularly functional magnetic resonance imaging (fMRI), is rapidly growing, with over 1,000 new publications annually and widespread use across diverse academic disciplines. As fMRI becomes a core tool for psychologists, neuroscientists, physicians, economists, lawyers, and engineers, understanding its intricacies has never been more critical. However, the interdisciplinary nature of neuroimaging presents challenges due to its combination of necessary biological, computational, statistical, and psychological expertise. This talk seeks to provide an accessible overview of how fMRI works, focusing on its underlying principles, and explain the variety of techniques used to analyze fMRI data. We will focus on essential conceptual tools to critically evaluate fMRI studies, avoid common pitfalls, and deepen the understanding of this powerful imaging technique. Our aim is to empower researchers to navigate and assess the complexities of neuroimaging in a rapidly evolving field.
  speaker_bio: |
    is a Professor of Biostatistics at Johns Hopkins University. His research focuses on mathematical and statistical problems relating to functional Magnetic Resonance Imaging (fMRI). Dr. Lindquist is actively involved in developing new analysis methods to enhance our ability to understand brain function using human neuroimaging. He has published over 100 articles, and serves on the editorial boards of several scientific journals both in statistics and neuroimaging. He is a fellow of the American Statistical Association. In 2018 he was awarded the Organization for Human Brain Mapping's Education in Neuroimaging Award for teaching statistical issues to the neuroimaging community and the development of online classes that have taught fMRI methods to more than 100,000 students world-wide.
