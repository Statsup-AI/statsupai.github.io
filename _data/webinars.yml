- date: 2025-08-11
  time_et: "1:00 PM"
  speaker: "Russell “Taki” Shinohara"
  speaker_full_name: "Dr. Russell Takeshi “Taki” Shinohara"
  affiliation: "University of Pennsylvania"
  title: "Harmonizing Neuroimaging Data Acquired in Multi-Center Studies of Human Health"
  registration_link: "https://upenn.zoom.us/meeting/register/SWlF2pdLR5SQZrAvhrgwFQ"
  recording_link: "https://www.youtube.com/watch?v=rkNgGrGCz-4"
  series: "Health"
  abstract: |
    While magnetic resonance imaging (MRI) studies are critical for the diagnosis, monitoring, and study of a wide variety of diseases, their use in quantitative analysis can be complex. An increasingly recognized issue involves the differences between MRI scanners that are used in large multi-center studies. To address this, the current state of the art is to “regress out” or “adjust for” scanner differences. The field has found these methods to be insufficient and has advocated for the adaptation of methods pioneered in genomics to help mitigate inter-scanner differences, which can vary across the brain and result in both mean and variance shifts. We further study the implications of differences in correlation structures across and between images, and how this affects downstream inference.
  speaker_bio: |
    is a Professor of Biostatistics at the University of Pennsylvania’s Perelman School of Medicine and Director of the Penn Statistics in Imaging and Visualization Endeavor (PennSIVE). His research focuses on developing statistical methods for analyzing structural and functional brain changes using quantitative biomedical imaging, particularly in neurological, psychiatric, and developmental disorders. He plays a central role in several interdisciplinary centers at Penn, including the Center for Clinical Epidemiology and Biostatistics and the Institute for Biomedical Informatics. Dr. Shinohara earned his Ph.D. in Biostatistics from Johns Hopkins University and has received numerous honors, including the 2023 Mortimer Spiegelman Award from the American Public Health Association. Being an elected fellow of ASA and a recognized leader in imaging science, Dr. Shinohara is widely published in high-impact journals and is known for his commitment to collaborative science and mentoring future leaders in biostatistics.
  speaker_image: "/assets/img/speakers/2025/08-11-taki-shinohara.jpg"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-1.svg"

- date: 2025-09-17
  time_et: "12:00 PM"
  speaker: "Zhengwu Zhang"
  speaker_full_name: "Dr. Zhengwu Zhang"
  affiliation: "University of North Carolina at Chapel Hill"
  title: "Exploring Brain Structure and Connectivity with Diffusion Weighted Imaging (DWI): From Data Acquisition to Statistical Analysis Methods"
  registration_link: "https://upenn.zoom.us/meeting/register/Dgy7tG3-R3arVeDDrWSOcA"
  recording_link: "https://www.youtube.com/watch?v=y-We1DurbXQ"
  series: "Health"
  abstract: |
    Diffusion-weighted imaging (DWI) is a powerful neuroimaging technique that captures the microscopic movement of water molecules in brain tissue, providing unique insights into white matter organization and structural connectivity. In this talk, I will introduce statistical and computational approaches for analyzing DWI data with a focus on both microstructure and connectome-level inference. We will begin with a discussion of what DWI measures and how acquisition strategies can be optimized to improve data quality. Next, I will review statistical methods for analyzing diffusion-derived microstructure measures, such as fractional anisotropy and mean diffusivity, and extend the discussion to structural connectome construction and analysis. Finally, I will highlight exciting new directions that combine advanced statistical frameworks and AI-based methods to tackle challenges in structural connectivity research. The goal of the talk is to provide researchers with an accessible overview of DWI data characteristics, analysis strategies, and emerging opportunities, and to encourage statisticians to contribute to novel methodological developments in this important field.
  speaker_bio: |
    is an Associate Professor in the Department of Statistics and Operations Research at the University of North Carolina at Chapel Hill. His research focuses on developing statistical and computational methods for analyzing complex biomedical data, with a particular emphasis on brain imaging and connectomics. He has contributed novel methodologies for structural and functional connectivity analysis, representation learning on manifolds and networks, and harmonization of large-scale neuroimaging datasets. Dr. Zhang has been recognized for his contributions with several honors, including the UNC Junior Faculty Development Award and the Oak Ridge Associated Universities Ralph E. Powe Junior Faculty Enhancement Award. In addition to his research, he teaches and mentors students in statistical consulting, computational tools for reproducible data science, and neuroimaging statistics.
  speaker_image: "/assets/img/speakers/2025/09-17-zhengwu-zhang.jpg"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-2.svg"
    affiliation_logo: "/assets/img/speakers/affiliations/unc-chapel-hill.png"

- date: 2025-10-08
  time_et: "2:00 PM"
  speaker: "Russell Poldrack"
  speaker_full_name: "Dr. Russell A. Poldrack"
  affiliation: "Stanford University"
  title: "Building Credibility in Neuroimaging Research through Open Science"
  registration_link: "https://upenn.zoom.us/meeting/register/hiaXRP-9ReimDcLLDDMKsg"
  recording_link: "https://www.youtube.com/watch?v=fSjWhxbeNH4"
  series: "Health"
  abstract: |
    It is now widely accepted that openness and transparency are keys to improving the reproducibility of scientific research, but many challenges remain to adoption of these practices. I will discuss the growth of an ecosystem for open science within the field of neuroimaging, focusing on platforms for open data sharing and open source tools for reproducible data analysis. I will also discuss the role of the Brain Imaging Data Structure (BIDS), a community standard for data organization, in enabling this open science ecosystem, and will outline the scientific impacts of these resources.
  speaker_bio: |
    is the Albert Ray Lang Professor in the Department of Psychology, and Director of the Stanford Center for Open and Reproducible Science. His research uses neuroimaging to understand the brain systems underlying decision making and executive function. His lab is also engaged in the development of neuroinformatics tools to help improve the reproducibility and transparency of neuroscience, including the Openneuro.org and Neurovault.org data sharing projects and the Cognitive Atlas ontology.
  speaker_image: "/assets/img/speakers/2025/10-08-russell-poldrack.jpg"
