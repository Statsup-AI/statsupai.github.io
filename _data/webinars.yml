- date: 2025-05-08
  time_et: "3:00 PM"
  speaker: "Ying Guo"
  speaker_full_name: "Dr. Ying Guo"
  affiliation: "Emory University"
  title: "Exploring Brain Function and Connectivity with fMRI: From Data Characteristics to Statistical and AI Methods"
  registration_link: "https://upenn.zoom.us/j/99182616852"
  recording_link: "https://www.youtube.com/watch?v=iC10I5zXQRI"
  series: "Health"
  abstract: |
    Neuroimaging technology has played a central role in advancing scientific understanding of normal brain function in humans, as well as in investigating the neural basis of psychiatric and neurological disorders. Among the various neuroimaging techniques, functional magnetic resonance imaging (fMRI) is one of the most commonly used tools in current neuroscience studies. This talk aims to introduce analytical techniques and statistical methods for investigating brain function and connectivity using fMRI. We will begin with a discussion of the background and key characteristics of fMRI data that are relevant to statistical modeling. This will be followed by an overview of fMRI analysis, with a focus on brain network and connectome analysis using statistical and AI-based approaches. The goal of the talk is to help familiarize researchers with data considerations, analysis procedures, and challenges in fMRI studies, thereby enabling more statisticians to contribute advanced and well-suited analytical tools for the field.
  speaker_bio: |
    is Professor in the Department of Biostatistics and Bioinformatics at Emory University, an appointed Graduate Faculty of the Emory Neuroscience Program and an Associate Faculty in Emory Department of Computer Science. She is a founding member and the current Director of the Center for Biomedical Imaging Statistics (CBIS) at Emory University. Dr. Guo’s research focuses on developing analytical methods for neuroimaging and mental health studies. Her main research areas include blind source separation (BSS) methods such as independent component analysis (ICA), brain network and connectome methods, multimodal imaging, longitudinal imaging modeling, and imaging-based prediction methods. Dr. Guo is a Fellow of the American Statistical Association (ASA) and served as the 2023 Chair of the ASA Statistics in Imaging Section. She has served on the editorial boards of several scientific journals in statistics and psychiatry, and also served as a standing member of the NIH Emerging Imaging Technologies in Neuroscience (EITN) study section.
  speaker_image: "/assets/img/speakers/2025/05-08-ying-guo.jpg"
  theme:
