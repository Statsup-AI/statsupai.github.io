- date: 2026-06-10
  time_et: "3:00 PM"
  speaker: "Jiang Bian"
  speaker_full_name: "Dr. Jiang Bian"
  affiliation: "Indiana University School of Medicine"
  title: "Real-World Data and AI: Successes, Challenges, and Opportunities"
  registration_link: "https://us02web.zoom.us/webinar/register/WN_SBuAdU3dQC-z-o6Lk-oG-w"
  recording_link: "https://www.youtube.com/watch?v=aJp4gTvOX4Q"
  series: "Health"
  abstract: |
    This presentation examines practical methods―and some AI tools―for transforming real-world data (RWD) into credible real-world evidence (RWE). It highlights the central role of data science in overcoming common obstacles in electronic health records (EHR) and claims data (e.g., missingness, measurement error, and coding variability). Using case studies focused on GLP-1 receptor agonists (GLP-1RAs), the talk illustrates how rigorous study design and causal inference―particularly target trial emulation―can be used to assess the effectiveness and safety of GLP-1RAs. The presentation emphasizes when and how RWE can complement randomized controlled trials―and where it can mislead without careful attention to potential biases, many of which originate from data limitations.
  speaker_bio: |
    is Walther and Regenstrief Endowed Chair in Cancer Informatics and a Professor of Biostatistics and Health Data Science from Indiana University (IU) School of Medicine. He specializes in biomedical informatics and health data science, interdisciplinary fields focused on leveraging data, information, and knowledge to drive scientific discovery, problem-solving, and decision-making, all aimed at improving human health. He has a diverse background in data harmonization and integration, AI/machine learning, causal AI, natural language processing, ontology development and evaluation, and software engineering. Dr. Bian brings extensive experience in developing real-world data infrastructure, informatics tools, and systems, as well as applying advanced AI and data science methods to analyze and interpret multimodal clinical and biomedical data. Dr. Bian serves as Chief Data Scientist at Regenstrief Institute, Chief Data Scientist at IU Health, Associate Dean of Data Science of Indiana University School of Medicine, Chief Research Information Officer at IU Melvin and Bren Simon Comprehensive Cancer Center, Regenstrief Institute Deputy Director of Indiana Clinical and Translational Sciences Institute (CTSI), and Vice Chair for Translational Informatics of the Department of Biostatistics and Health Data Science at IU School of Medicine.
