- date: 2026-09-23
  time_et: "2:00 PM"
  speaker: "Edgar Dobriban"
  speaker_full_name: "Dr. Edgar Dobriban"
  affiliation: "University of Pennsylvania"
  title: "Recent Progress on Using AI for Research in Statistics"
  registration_link: "https://us02web.zoom.us/webinar/register/WN_dq5GpQIhRQGSHF_5PcR_ng"
  recording_link: "https://www.youtube.com/watch?v=Q3MDqhEAOyw"
  series: "Health"
  abstract: |
    Recent AI models have led to remarkable progress on longstanding open problems in mathematics, and their agentic modes can perform significant coding tasks. In this talk, we reflect on the impact of these advances on research in statistics. We will provide several examples where AI models have helped make progress in statistical research. We also discuss the future outlook, balancing the potential benefits and harms of increasing reliance on AI.
  speaker_bio: |
    is an Associate Professor in the Department of Statistics and Data Science at the University of Pennsylvania, with a secondary appointment in the Department of Computer and Information Science. Dr. Dobriban earned his B.A. in Mathematics from Princeton University and his Ph.D. in Statistics from Stanford University. His research spans mathematical statistics, statistical machine learning, and artificial intelligence, focusing on areas such as high-dimensional asymptotics, conformal prediction, AI safety, distributed learning, and uncertainty quantification. His contributions to the field have earned him prominent accolades, including the Peter Gavin Hall IMS Early Career Prize, a COPSS Emerging Leader Award, an NSF CAREER Award, and a Sloan Research Fellowship.
