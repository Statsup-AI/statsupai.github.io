- date: 2026-02-09
  time_et: "2:00 PM"
  speaker: "Robert Kass"
  speaker_full_name: "Dr. Rob Kass"
  affiliation: "Carnegie Mellon University"
  title: "Neural Data from Electrodes: Overview and Challenges"
  registration_link: "https://upenn.zoom.us/meeting/register/XQ5KxNmfQIaAd4sZ-Fol6Q"
  recording_link: "https://www.youtube.com/watch?v=zfPiPtz37WA"
  series: "Health"
  abstract: |
    I will review the two main kinds of electrode recordings made within the brain by neurophysiologists: spike trains from individual neurons (often modeled as point processes) and local field potentials, which represent activity from many dozens of neurons (they are time series). I will focus on the Allen Brain Observatory's Neuropixels Dataset in the context of identifying interactions across distinct parts of the brain. My goal is to explain, briefly, the way electrodes produce spike trains and local field potentials; the information these measurements can provide; and both the opportunities and statistical challenges in identifying neural communication across the brain using this kind of relatively large dataset. I will also mention a hybrid AI-statistical method based on what we have called a GLM-Transformer model, and I will touch on the ways multiple investigators have been developing and deploying foundation models (typically based on Transformers) to learn from neural data.
  speaker_bio: |
    is the Maurice Falk University Professor of Statistics and Computational Neuroscience at Carnegie Mellon University (CMU), with appointments in the Department of Statistics & Data Science, the Machine Learning Department, and the Neuroscience Institute. Dr. Kass received Ph.D. in Statistics from the University of Chicago, and has made foundational contributions to Bayesian inference and the differential geometry of statistical models, including influential reassessments of Bayes factors and prior specification. Since 2000, his research has focused on statistical methods for neuroscience, particularly the analysis of neural spike train data using point process models to study information processing and interactions across brain regions during behavior. Dr. Kass is co-author of *Analysis of Neural Data* and has written widely cited review and perspective articles that clarify how statistical reasoning advances scientific understanding. Dr. Kass, a former Department Head of Statistics at CMU, has served as founding Editor-in-Chief of *Bayesian Analysis*, and Executive Editor of *Statistical Science*. In addition, Dr. Kass is an elected fellow of the ASA, IMS, and AAAS, a recipient of numerous major professional awards (e.g., Distinguished Achievement Award and Lectureship from the Committee of Presidents of Statistical Societies in 2017), and an elected member of the National Academy of Sciences.
  speaker_image: "/assets/img/speakers/2026/02-09-robert-kass.jpg"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-1.svg"

- date: 2026-02-11
  time_et: "1:00 PM"
  speaker: "James Zou"
  affiliation: "Stanford University"
  title: "AI agents to accelerate scientific discoveries"
  registration_link: "https://sfu.zoom.us/meeting/register/3MLcnkc9TJCYfHNrdVSbeQ#/registration"
  recording_link: "https://www.youtube.com/watch?v=pl_ek2PvFb0"
  series: "GenAI"
  abstract: |
    AI agents--large language models equipped with tools and reasoning capabilities--are emerging as powerful research enablers. This talk will explore how agentic AI can accelerate scientific discoveries. I’ll first introduce the Virtual Lab--a collaborative team of AI scientist agents conducting in silico research meetings to tackle open-ended research projects. As an example application, the Virtual Lab designed new nanobody binders to recent Covid variants that we experimentally validated. Then I will introduce Paper2Agent, a framework to automatically convert passive research papers into interactive AI agents. Finally I will discuss learnings from Agents4Science, the first conference where the authors and reviewers are primarily AI systems.
  speaker_bio: |
     is an Associate Professor of Biomedical Data Science and, by courtesy, Computer Science and Electrical Engineering at Stanford University. His research focuses on making AI more reliable and human-compatible, with particular interest in applications for human disease and health. He is a two-time Chan-Zuckerberg Investigator (2017, 2023), Faculty Director at the Stanford Data Science Institute, and a member of the Stanford AI Lab. He received the Overton Prize, NSF CAREER Award, and Sloan Fellowship, along with multiple best paper awards and faculty awards from Google, Amazon, Genentech, and Apple.
  personal_website: "https://www.james-zou.com"
