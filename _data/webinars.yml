- date: 2026-10-13
  time_et: "1:00 PM"
  speaker: "Anru Zhang"
  speaker_full_name: "Dr. Anru Zhang"
  affiliation: "Duke University"
  title: "Making EHR Ready for Analysis and AI: Statistics at the Data Frontier"
  registration_link: "https://us02web.zoom.us/webinar/register/WN_s-YLyIQ8SCWuORhJyyL4yw"
  recording_link: ""
  series: "Health"
  abstract: |
    Electronic health records (EHR) are increasingly central to clinical research and AI, but they are not simply “big data.” They are irregular, heterogeneous, imbalanced, privacy-sensitive, and sometimes internally inconsistent. As a result, reliable statistical learning and inference often requires first solving problems of data readiness. In this talk, we will discuss statistical and computational methods our group has developed to make longitudinal EHR more comparable, learnable, shareable, and trustworthy. Topics include timeline registration for aligning patients along latent disease progression; synthetic data augmentation for learning from imbalanced EHR; privacy-preserving synthetic EHR generation; and large-language-model-assisted detection of clinical documentation inconsistencies. These examples motivate a broader perspective in which preparing EHR for analysis and AI is itself a statistical problem, and a necessary foundation for trustworthy clinical and generative AI.
  speaker_bio: |
    is a tenured full professor with primary appointments in the Department of Biostatistics & Bioinformatics and the Department of Computer Science at Duke University. He also serves as Vice Chair for Research in Duke’s Department of Biostatistics & Bioinformatics. His current research interests include generative models, biomedical data science, and tensor learning. He has received the Leo Breiman Junior Award, COPSS Emerging Leader Award, IMS Tweedie Award, ASA Gottfried E. Noether Junior Award, AMIA Data Science Outstanding Paper Award, Bernoulli Society New Researcher's Award, and NSF CAREER Award. He is a Fellow of the American Statistical Association (ASA). His trainees have also received major recognition, including two of his Ph.D. students who received the IMS Lawrence D. Brown Ph.D. Student Award. He currently serves as an associate editor for *The Annals of Statistics*, *Journal of the American Statistical Association* Theory & Methods and Applications & Case Studies, *Statistica Sinica*, and *ASA Discoveries*. His research is currently supported by two NIH R01 grants, one as sole PI and one as MPI with clinical investigators.
