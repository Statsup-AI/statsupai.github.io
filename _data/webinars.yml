- date: 2025-07-16
  time_et: "12:00 PM"
  speaker: "Dana Tudorascu"
  speaker_full_name: "Dr. Dana Tudorascu"
  affiliation: "University of Pittsburgh"
  title: "Statistical Challenges in Data Harmonization Studies of Alzheimer’s Disease using Positron Emission Tomography (PET) and Magnetic Resonance Imaging (MRI)"
  registration_link: "https://upenn.zoom.us/j/96801286016"
  recording_link: "https://www.youtube.com/watch?v=ujhrkUKqTMM"
  series: "Health"
  abstract: |
    Multisite imaging studies increase statistical power and enable the generalization of research outcomes; however, due to the variety of imaging acquisition, different PET tracer properties and inter-scanner variability hinders the direct comparability of multi-scanner PET data. The PET imaging field is lacking behind in terms of harmonization methods due to the complexity associated with the combination of different tracers and different scanners. Similarly, MRI present similar challenges, but mainly due to scanner differences. In this study we investigate samples of cognitively normal participants, mild cognitive impaired and Alzheimer’s disease subjects in two major multisite studies of Alzheimer’s disease.

    We present challenges and solutions associated with different MRI scanners, PET tracers, as well as analysis and harmonization techniques including simple imaging standardization, Combat and deep learning methods. We show regions of interest differences in PET outcome measures before and after the harmonization in multisite studies of Alzheimer’s Disease as well as voxel level harmonization along with summary measures before and after harmonization in MRI studies.
  speaker_bio: |
    received her PhD in Biostatistics from University of Pittsburgh, a MS in Computational Mathematics from Duquesne University and a BS in Mathematics from University of Craiova in Romania. She is currently an Associate Professor of Psychiatry and Biostatistics in the Department of Psychiatry at the University of Pittsburgh where she Co-Leads the Study Design and Data Analysis Group. She is the Leader of the Biostatistics Core for the “The Role of Astrogliosis in Aging and the Pathological and Clinical Progression of Alzheimer’s Disease” program, Co-Leads the Data Management and Statistics Core for ADRC at Pitt as well as the Biostatistics and Data Management Core for Alzheimer’s Disease Biomarker’s Consortium-Down Syndrome (ABC-DS), an international multisite study.

    Dr. Tudorascu’s research focuses on developing methods for data harmonization for multi scanner, multi center neuroimaging studies as well as on improving brain tissue classification in the presence of white matter lesions and atrophy in neuroimaging studies of Alzheimer’s disease. She is currently principal investigator of a National Institute on Aging-funded R01 grant focused on statistical methods to improve reproducibility and reduce technical variability in multimodal imaging studies of Alzheimer’s disease.

    Dr. Tudorascu collaborates widely with colleagues in psychiatry, biostatistics, neurology, radiology, among many other departments at Pitt as well as outside institutions. Dr. Tudorascu’s activities include training others in statistical methods used in multimodal imaging studies of neuropsychiatric disorders.
