- date: 2025-11-05
  time_et: "12:00 PM"
  speaker: "Brian Caffo"
  speaker_full_name: "Dr. Brian Caffo"
  affiliation: "Johns Hopkins University"
  title: "Does AI Need to Be Artificial? Does It Need to Be Intelligent?"
  registration_link: "https://upenn.zoom.us/meeting/register/9I_jSjx8RF-8HJNEKCttcg"
  recording_link: "https://www.youtube.com/watch?v=AhhVzzZTeMY"
  series: "Health"
  abstract: |
    In this talk we consider the fascinating possibility of organoid intelligence (OI). Organoid intelligence using human derived pluripotent stem cells to create neural clusters with measurable neuronal activity. We discuss a recent JHU effort in OI from a team of neuroscientists, engineers, signal processors and statisticians. The goal is to use organoids to perform complex computing tasks through stimulation and response. Measurement is obtained from an electrode shell custom designed for three dimensional measurements. Apart from OI, organoids electrophysiology experiments are useful for studying human genetic disorders and toxicity through another phenotype in vitro. Here, we will focus on the statistical challenges underlying this novel form of measurement. Time permitting, we will discuss other efforts in biocomputing.
  speaker_bio: |
    , PhD, is a professor in the Department of Biostatistics with a secondary appointment in the Department of Biomedical Engineering at Johns Hopkins University. He graduated from the University of Florida Department of Statistics in 2001. He has worked in statistical computing, statistical modeling, computational statistics, multivariate and decomposition methods and statistics in neuroimaging and neuroscience. He led teams that won the ADHD 200 prediction competition. He co-directs the SMART statistical group. With other faculty at JHU, he created and co-directed the Coursera Data Science Specialization, a 10-course specialization on statistical data analysis. He co-directs the JHU Data Science Lab, a group dedicated to open educational innovation and data science. He is the former director of the Biostatistics graduate programs and admissions committees. He is the co-director of the Johns Hopkins High Performance Computing Exchange supercomputing service center, former president of the Bloomberg School of Public Health faculty senate and Director of Academic Programs and Education for the Data Science and AI institute.
  speaker_image: "/assets/img/speakers/2025/11-05-brian-caffo.jpg"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-2.svg"

- date: 2025-12-02
  time_et: "1:00 PM"
  speaker: "Ani Eloyan"
  speaker_full_name: "Dr. Ani Eloyan"
  affiliation: "Brown University"
  title: "Manifold Learning for Modeling Shapes in Alzheimer's Disease"
  registration_link: "https://upenn.zoom.us/meeting/register/SL8s_eubT-6qoVoMJRsK6w"
  recording_link: "https://www.youtube.com/watch?v=RMP2cC8XdSI"
  series: "Health"
  abstract: |
    Estimation of biomarkers related to disease classification and modeling of its progression is essential for treatment development for Alzheimer’s Disease (AD). The task is more daunting for characterizing relatively rare AD subtypes such as the early-onset AD. In this talk, I will describe the Longitudinal Early-onset Alzheimer’s Disease Study (LEADS) intending to collect and publicly distribute clinical, imaging, genetic, and other types of data from people with EOAD, as well as cognitively normal (CN) controls and people with early-onset non-amyloid positive (EOnonAD) dementias. I will discuss manifold estimation methods for estimation of surfaces of shapes in the brain using data clouds, factor-analytic methods for estimation of clinical biomarkers of AD and their use for modeling differences in longitudinal trajectories of clinical deterioration between CN, EOAD, and EOnonAD groups.
  speaker_bio: |
    is an Associate Professor and Vice Chair in the Department of Biostatistics at Brown University. Broadly, her research focuses on developing statistical methods for analyzing brain imaging data for large groups of subjects, including matrix decomposition methods, machine learning, analysis of longitudinal brain imaging data, among others. Currently, she is developing machine learning algorithms for imaging-based feature extraction from positron emission tomography data, prediction of cognitive decline, and biomarker estimation in Alzheimer’s disease. Dr. Eloyan has served on editorial boards including as Associate Editor of Journal of American Statistical Association (JASA) and Biostatistics. Her work has been published in leading statistics and imaging outlets including the Journal of Royal Statistical Society (Series B), JASA, Biostatistics, NeuroImage Clinical, and Alzheimer’s and Dementia. She leads the Biostatistics Core of the Longitudinal Early-onset Alzheimer's Disease Study (LEADS) and is the Principal Investigator of an R01 grant from NIA to develop biomarker estimation methods for multimodal-imaging studies in Alzheimer's Disease. Dr. Eloyan received her PhD in Statistics from North Carolina State University in 2010. She completed a postdoctoral fellowship in the Department of Biostatistics at Johns Hopkins Bloomberg School of Public Health in 2013.
  speaker_image: "/assets/img/speakers/2025/12-02-ani-eloyan.jpg"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-1.svg"

- date: 2026-01-09
  time_et: "12:00 PM"
  speaker: "Andrew Saykin"
  speaker_full_name: "Dr. Andrew J. Saykin"
  affiliation: "Indiana University School of Medicine"
  title: "Deconstructing Alzheimer’s Disease and Related Dementias to Enable Precision Medicine: Challenges, Models, and Resources for Data Science"
  registration_link: "https://upenn.zoom.us/meeting/register/uA1Jh_J8T3Wez4q0rbpTLQ#/registration"
  recording_link: "https://www.youtube.com/watch?v=ZlyMg_kpbYg"
  series: "Health"
  abstract: |
    Alzheimer’s disease (AD) and related dementia (ADRD) research has become increasingly big data-driven, relying on large, heterogeneous, and longitudinal datasets that span imaging, biomarkers, genetics, and clinical phenotyping. Experimental data from model systems and clinical trials now often include rich high dimensional data along with key outcomes. Although researchers have known about plaques and tangles, composed of amyloid beta and tau proteins for over a century, the underlying causes of most forms of AD/ADRD remain unknown. This lecture will discuss foundational questions and challenges in ADRD research including how data sciences/AI can help advance precision diagnostic and therapeutic strategies for ADRD and will introduce the growing ensemble of accessible data resources available for analysis in an open science framework. Major NIA-funded observational data resources such as the National Alzheimer’s Coordinating Center (NACC) and Alzheimer’s Disease Neuroimaging Initiative (ADNI) and affiliated neuroimaging, genetics, and multi-omics data repositories will be described, along with efforts at data harmonization. Future directions include increasing use of large-scale electronic health records and national databases providing a window to diagnoses, treatment and outcomes in real-world clinical healthcare settings. Finally, bottlenecks in advancing knowledge of causal mechanisms, early detection, and development of novel therapeutic strategies will be discussed.
  speaker_bio: |
    , Psy.D., is the Raymond C. Beeler Professor of Radiology and Imaging Sciences and Professor of Medical and Molecular Genetics at the Indiana University School of Medicine. Dr. Saykin serves as director of the Indiana Alzheimer's Disease Research Center (IADRC) and IU Center for Neuroimaging. He leads the ADNI Genetics Core and is an MPI of several NIA-sponsored consortia (CLEAR-AD, KBASE, AI4AD) with experience in collaborative, transdisciplinary, and multi-institutional team science. His current research program focuses on systems biology approaches to understanding pathways driving AD/ADRD, leveraging multimodal neuroimaging, multi-omics biomarkers, and AI-based strategies. Dr. Saykin is the founding editor-in-chief of *Brain Imaging and Behavior*, and a highly cited author with over 700 publications.
  personal_website: "https://medicine.iu.edu/faculty/6962/saykin-andrew"
  speaker_image: "/assets/img/speakers/2026/01-09-andrew-saykin.png"
  theme:
    bg_pattern_svg: "/assets/img/bg/polygon-2.svg"
    affiliation_logo: "/assets/img/speakers/affiliations/indiana-university.png"

- date: 2026-01-16
  time_et: "12:00 PM"
  speaker: "Mine Çetinkaya-Rundel"
  affiliation: "Duke University"
  title: "Leveraging LLMs for student feedback in introductory data science courses"
  registration_link: "https://upenn.zoom.us/meeting/register/7iwjCrS6Qia0EbrBodLyQw#/registration"
  recording_link: "https://www.youtube.com/watch?v=uwCr5xlRBs4"
  series: "GenAI"
  abstract: |
    A considerable recent challenge for learners and teachers of data science courses is the increasing use of LLM-based tools in generating answers. In this talk, I will introduce an R package that leverages LLMs to produce immediate feedback on student work to motivate them to give it a try themselves first. I will discuss the technical details of augmenting models with course materials, as well as backend and user interface decisions, challenges surrounding evaluations that are not performed correctly by the LLM, and student feedback from the first set of users. Finally, I will discuss incorporating this tool into low-stakes assessments and address ethical considerations for the formal assessment structure of the course, which relies on LLMs.
  speaker_bio: |
    is a Professor of the Practice and Director of Undergraduate Studies in the Department of Statistical Science at Duke University, and Director of the First-Year Experience in Trinity College of Arts & Sciences. Her work focuses on innovation in statistics and data science pedagogy, with an emphasis on computing, reproducible research, student-centered learning, and open-source education. She is a contributor to the OpenIntro Statistics textbook and develops R packages and resources for data science education.
  personal_website: "https://mine-cr.com"
