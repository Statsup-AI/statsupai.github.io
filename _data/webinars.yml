- date: 2026-04-23
  time_et: "1:00 PM"
  speaker: "Josh Siegle"
  speaker_full_name: "Dr. Josh Siegle"
  affiliation: "Allen Institute"
  title: "Large-Scale Open Data as a Foundation for Discovery: Lessons from the Allen Brain Observatory"
  registration_link: "https://us02web.zoom.us/meeting/register/p2T9QVjbQ1epN7WcSdC5fQ"
  recording_link: "https://www.youtube.com/watch?v=EeDdRsyoQzA"
  series: "Health"
  abstract: |
    Modern biomedical and neuroscience research increasingly depends on large-scale, standardized datasets to achieve the statistical power needed to detect subtle effects, characterize population-level variability, and validate computational models. Yet in practice, open data sharing remains the exception rather than the norm, limiting the community's ability to leverage these advantages. The Allen Brain Observatory is a case study in what becomes possible when large-scale surveys of neuronal activity are made freely available. These openly shared datasets, which include recordings of spiking activity across up to 8 mouse visual areas at a time, offer the kind of sample sizes and consistency that are rarely achievable within a single laboratory. To date, data from these surveys have supported over 100 publications spanning new neuroscientific discoveries, validation of computational and statistical algorithms, and cross-modality comparisons. I will discuss how open data at this scale creates unique opportunities for the development and testing of statistical and machine learning methods in high-dimensional neural data, and distill lessons learned about barriers to data reuse that are broadly relevant to health data science.
  speaker_bio: |
    leads the Electrophysiology group at the Allen Institute for Neural Dynamics. He joined the Allen Institute in 2014 and spent seven years investigating the mouse visual system as part of the MindScope Program, contributing to the large-scale data collection efforts described in this talk. Josh received a PhD in Neuroscience from MIT, where he studied hippocampal circuits with Matthew Wilson and somatosensory processing with Christopher Moore, and an Sc.B. in Neuroscience from Brown University. Beyond his scientific work, Josh is deeply involved in the design and dissemination of open-source tools for neuroscience, and co-founded Open Ephys to support collaborative open-source development across the research community.
